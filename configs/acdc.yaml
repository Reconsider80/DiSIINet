# DiSIINet config for ACDC (MRI) dataset
dataset:
  name: acdc
  root: ./data/ACDC
  image_size: 320
  num_classes: 4  # background + RV + MYO + LV

model:
  latent_channels: 4
  base_channels: 64
  channel_mult: [1, 2, 4, 8]
  num_res_blocks: 2
  attention_resolutions: [16, 8]
  num_heads: 8
  dropout: 0.0

diffusion:
  num_train_timesteps: 1000
  num_inference_steps: 50
  beta_start: 0.0001
  beta_end: 0.02
  schedule: cosine
  eta_train: 1.0
  eta_infer: 0.0

loss:
  beta: 1.0
  lambda_seg: 0.5

train:
  batch_size: 32
  num_epochs: 200
  lr: 1.0e-4
  weight_decay: 1.0e-2
  num_workers: 4
  save_interval: 10
  log_interval: 50
  output_dir: ./outputs/acdc

inference:
  output_dir: ./results/acdc
