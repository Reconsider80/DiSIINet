# Demo config for smoke testing
dataset:
  name: acdc
  root: ./data/demo
  image_size: 128
  num_classes: 4

model:
  latent_channels: 4
  base_channels: 32
  channel_mult: [1, 2, 4]
  num_res_blocks: 1
  attention_resolutions: [16]
  num_heads: 4
  dropout: 0.0

diffusion:
  num_train_timesteps: 100
  num_inference_steps: 10
  beta_start: 0.0001
  beta_end: 0.02
  schedule: cosine
  eta_train: 1.0
  eta_infer: 0.0

loss:
  beta: 1.0
  lambda_seg: 0.5

train:
  batch_size: 2
  num_epochs: 2
  lr: 1.0e-4
  weight_decay: 1.0e-2
  num_workers: 0
  save_interval: 1
  log_interval: 1
  output_dir: ./outputs/demo

inference:
  output_dir: ./results/demo
